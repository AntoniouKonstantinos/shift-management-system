<div class="modal">
  <div class="modal-content">
    <h3>{{ employee ? 'Employee Edit' : 'New Employee' }}</h3>
    <form (ngSubmit)="onSubmit()">
      <label>First-Last Name</label>
      <input type="text" [(ngModel)]="fullName" name="fullName" required />

      <label>Email</label>
      <input type="email" [(ngModel)]="email" name="email" required />

      <label>Phone Number</label>
      <input type="text" [(ngModel)]="phone" name="phone" />

      <label>Role</label>
      <select [(ngModel)]="roleId" name="roleId" required>
        <option *ngFor="let role of roles()" [ngValue]="role.id">{{ role.name }}</option>
      </select>

      <label>{{ hasAccount ? 'New password (optional)' : 'Password (optional)' }}</label>
      <input
        type="password"
        [(ngModel)]="password"
        name="password"
        autocomplete="new-password"
      />
      <p class="hint">
        {{
          hasAccount
            ? 'Leave empty to keep the current password.'
            : 'Leave empty to keep this employee without a login.'
        }}
      </p>

      <label>Access level</label>
      <select
        [(ngModel)]="accessLevel"
        name="accessLevel"
        [disabled]="!hasAccount && !password()"
      >
        <option value="employee">Employee</option>
        <option value="manager">Manager</option>
      </select>

      <div class="modal-actions">
        <button type="submit">Save</button>
        <button type="button" (click)="onCancel()">Cancel</button>
      </div>
    </form>
  </div>
</div>
